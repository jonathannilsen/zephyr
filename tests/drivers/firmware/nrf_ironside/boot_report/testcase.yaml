common:
  tags:
    - drivers
    - hwinfo
  harness: console

tests:
  drivers.firmware.nrf_ironside.boot_report:
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "err: 0"
        - "version: ([0-9]+\\.[0-9]+\\.[0-9]+-[0-9a-zA-Z]+\\+[0-9]+)"
        - "recovery version: ([0-9]+\\.[0-9]+\\.[0-9]+-[0-9a-zA-Z]+\\+[0-9]+)"
    platform_allow:
      - nrf54h20dk/nrf54h20/cpuapp/iron
    integration_platforms:
      - nrf54h20dk/nrf54h20/cpuapp/iron
